[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "speakable"
version = "1.1.0"
description = "Text normalization for voice agents - turn LLM output into text a TTS engine speaks correctly."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Divyajeet" }]
keywords = ["tts", "text-to-speech", "voice-agent", "normalization", "livekit", "speech", "nlp"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Text Processing :: Linguistic",
]
dependencies = []

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn[standard]>=0.27", "pydantic>=2.0"]

[project.urls]
Homepage = "https://github.com/Divyajeet01/speakable"
Issues = "https://github.com/Divyajeet01/speakable/issues"

[tool.setuptools]
packages = ["speakable"]
