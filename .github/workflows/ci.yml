name: tests

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    # 3.9 is the floor pyproject.toml claims, so it is the floor that is tested.
    # It needs an older image to run on: ubuntu-latest is Ubuntu 26.04 now, and
    # setup-python publishes no 3.9 build for it.
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: "3.9"
            os: ubuntu-22.04
          - python: "3.10"
            os: ubuntu-latest
          - python: "3.11"
            os: ubuntu-latest
          - python: "3.12"
            os: ubuntu-latest
          - python: "3.13"
            os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Normalizer suite
        run: python tests/test_normalize.py
      # The browser engine in docs/index.html is a hand-written port of the
      # library; this fails the build if the two have drifted apart.
      - name: Browser-engine parity
        run: python tests/test_parity.py
      - name: Package imports with no dependencies installed
        run: python -c "import speakable; print(speakable.__version__)"

  api:
    # The HTTP wrapper is optional, so it gets its own job with the extras.
    # Pinned to 3.9 on the matching image: this job exists to catch the
    # list[str] class of bug, which only shows up on the oldest Python.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - run: pip install -r requirements.txt
      - name: App imports and serves on the oldest supported Python
        run: python -c "import app; print(app.app.title, app.app.version)"
